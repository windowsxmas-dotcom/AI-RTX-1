<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIRTX 1</title>
<style>
:root{--bg:#0c0e14;--pn:#141722;--ln:#252a3a;--tx:#eceef6;--mu:#8b92aa;--ac:#6d7cff;--ac2:#35d0ff;--er:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
aside{width:270px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:transparent;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;width:100%;text-align:center}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:600}
aside label{color:var(--mu);font-size:13px;display:flex;flex-direction:column;gap:6px}
select,input{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px;min-width:0;width:100%}
#acc{border-top:1px solid var(--ln);padding-top:14px;display:flex;flex-direction:column;gap:10px;font-size:13px}
#acc h3{font-size:13px;color:var(--mu);font-weight:600}
.who{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:8px}
.who img,.who i{width:32px;height:32px;border-radius:50%;flex:none;background:var(--ln);object-fit:cover}
.who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mu)}
.who button{margin-left:auto;background:none;border:0;color:var(--mu);font-size:12px;text-decoration:underline}
.note{color:#ffd37a;font-size:12px;line-height:1.4}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:none;padding:10px 12px;border-bottom:1px solid var(--ln);align-items:center;gap:10px}
header select{flex:1}
header .menu{background:none;border:1px solid var(--ln);border-radius:10px;width:40px;height:38px;font-size:18px}
#log{flex:1;overflow-y:auto;padding:24px 16px;display:flex;justify-content:center}
.w{width:100%;max-width:780px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.hello{margin:auto;text-align:center;padding:20px}
.hello h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.hello p{color:var(--mu);margin-top:8px}
.m{max-width:92%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:6px}
.b{align-self:flex-start;background:var(--pn);border:1px solid var(--ln);border-bottom-left-radius:6px}
.err{color:var(--er)}
.m code{background:var(--bg);border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.m pre{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre}
.m pre code{background:none;padding:0}
.m img.gen{display:block;max-width:100%;max-height:70vh;border-radius:12px}
.vid{position:relative;display:inline-block;border-radius:12px;overflow:hidden;max-width:100%}
.vid video{display:block;max-width:100%;max-height:65vh}
.wm{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
audio{display:block;width:100%;min-width:240px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;white-space:normal}
.acts button{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;font-size:13px}
.acts button:hover{border-color:var(--ac)}
.dots{display:inline-flex;gap:4px;margin-right:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:p 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes p{50%{opacity:.25}}
form{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.box{width:100%;max-width:780px;display:flex;gap:10px;align-items:flex-end;background:var(--pn);border:1px solid var(--ln);border-radius:22px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--ac)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:160px;padding:8px 0}
#go{width:42px;height:42px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:18px}
#go:disabled{opacity:.4;cursor:default}
#clip{background:none;border:0;font-size:20px;padding:6px 2px}
#chip{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:4px 8px;font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bd{display:none}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mu)}
#msb{display:flex;flex-direction:column;gap:8px;font-size:13px}
#msb h3{font-size:13px;color:var(--mu);font-weight:600}
#msr{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto}
.mr{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:7px 9px;text-align:left;width:100%}
.mr:hover{border-color:var(--ac)}
.mr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mr small{color:var(--mu);flex:none}
#extb{display:flex;flex-direction:column;gap:8px;font-size:13px}
#extb h3{font-size:13px;color:var(--mu);font-weight:600}
#extb small{color:var(--mu);line-height:1.4}
#set{font-size:13px;color:var(--mu)}
#set summary{cursor:pointer;padding:4px 0}
#set>*:not(summary){margin-top:10px}
#sys{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px;resize:vertical;max-height:none;min-height:70px;width:100%;color:var(--tx)}
#temp{padding:0;border:0;background:none}
body.drag::after{content:"Отпусти файл, чтобы прикрепить";position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(12,14,20,.8);border:2px dashed var(--ac);font-size:20px;pointer-events:none}
#go.stop{background:#ff6b6b}
@media(max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;z-index:20;width:min(310px,88vw);transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  aside.open~#bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
  header{display:flex}
  #log{padding:16px 10px}
  .m{max-width:96%}
}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}aside{transition:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="logo">AIRTX 1</div>
  <button class="btn" id="new">Новый чат</button>
  <label>Модель<select id="model"></select></label>
  <div class="legend"><span>🟢 только бесплатные провайдеры и модели</span></div>
  <label>Провайдер<select id="prov"></select></label>
  <details id="set">
    <summary>Настройки и чат</summary>
    <label>Системная инструкция (для текстовых моделей)<textarea id="sys" rows="3" placeholder="Например: отвечай кратко и по-русски"></textarea></label>
    <label>Креативность: <b id="tv">0.7</b><input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.7"></label>
    <button class="btn" id="exp" type="button">Сохранить чат в .txt</button>
  </details>
  <div id="extb"></div>
  <div id="msb">
    <h3>Найти свою модель</h3>
    <input id="msq" placeholder="например: flux, llama, whisper…" autocomplete="off">
    <button class="btn" id="msg" type="button">Искать на Hugging Face</button>
    <div id="msr"></div>
    <button class="btn" id="msadd" type="button">Добавить по точному ID</button>
  </div>
  <div id="acc"></div>
</aside>
<div id="bd"></div>
<main>
  <header><button class="menu" id="menu" aria-label="Меню">☰</button><select id="model2"></select></header>
  <div id="log"><div class="w" id="w"><div class="hello" id="hello"><h1>Привет, это AIRTX 1</h1><p>Выбери модель — текстовую, картиночную или видео — и напиши запрос.</p></div></div></div>
  <form id="f"><div class="box"><button type="button" id="clip" aria-label="Прикрепить">📎</button><button type="button" id="chip" hidden></button><input type="file" id="file" accept="image/*,audio/*" hidden><textarea id="inp" rows="1" placeholder="Напиши запрос…"></textarea><button id="go" type="submit" aria-label="Отправить">➤</button></div></form>
</main>
<script>
// ====== НАСТРОЙКИ ======
const CFG = {
  HF_TOKEN: "",           // можно вписать токен сюда, чтобы не вводить в приложении
  WATERMARK: "AIRTX 1",   // запасной текст на крайний случай
  HF_CLIENT_ID: "",       // нужен только для кнопки «Войти через Hugging Face» вне Space (OAuth-приложение на HF)
  GOOGLE_CLIENT_ID: ""    // для входа через Google: Client ID из Google Cloud Console (OAuth, Web)
};
// free:1 = бесплатная (🟢), free:0 = платная (🔴). Правь вручную, если у тебя иначе.
// Для найденных моделей: бесплатной считается та, что работает через провайдера hf-inference.
const MODELS = [
  {id:"meta-llama/Llama-3.1-8B-Instruct", name:"Llama 3.1 8B", type:"text", free:1, pv:"hf-inference"},
  {id:"black-forest-labs/FLUX.1-schnell", name:"FLUX.1 schnell", type:"image", free:1, pv:"hf-inference"},
  {id:"openai/whisper-large-v3", name:"Whisper (речь → текст)", type:"stt", free:1, pv:"hf-inference"},
  {id:"hexgrad/Kokoro-82M", name:"Kokoro (текст → речь)", type:"tts", free:1, pv:"hf-inference"}
];
try{(JSON.parse(localStorage.getItem("airtx_custom")||"[]")).forEach(m=>{if(m.free&&!m.ext&&!MODELS.some(x=>x.id===m.id))MODELS.push({...m,pv:"hf-inference"})})}catch(e){}
const ICON = {text:"💬", image:"🖼", video:"🎬", stt:"🎙", tts:"🔊"};
// список провайдеров — ниже, рядом с EXT
// =======================
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const log=$("log"),w=$("w"),inp=$("inp"),go=$("go"),sel=$("model"),sel2=$("model2"),prov=$("prov"),side=$("side");
let history=[],busy=false,token=CFG.HF_TOKEN||LS.get("airtx_hf")||"",hfUser=JSON.parse(LS.get("airtx_hfu")||"null"),gUser=JSON.parse(LS.get("airtx_g")||"null"),accNote="";

let ctrl=null,sent=[],sentI=0;
// ---------- бесплатные внешние провайдеры (нужен свой бесплатный ключ) ----------
const EXT={
  groq:{n:"Groq",base:"https://api.groq.com/openai/v1",keyUrl:"console.groq.com/keys",models:["llama-3.3-70b-versatile","llama-3.1-8b-instant","openai/gpt-oss-120b"]},
  cerebras:{n:"Cerebras",base:"https://api.cerebras.ai/v1",keyUrl:"cloud.cerebras.ai",models:["llama-3.3-70b","llama3.1-8b","gpt-oss-120b"]},
  openrouter:{n:"OpenRouter (модели :free)",base:"https://openrouter.ai/api/v1",keyUrl:"openrouter.ai/keys",onlyFree:1,models:["meta-llama/llama-3.3-70b-instruct:free","deepseek/deepseek-r1:free","google/gemini-2.0-flash-exp:free"]},
  gemini:{n:"Google Gemini",base:"https://generativelanguage.googleapis.com/v1beta/openai",keyUrl:"aistudio.google.com/apikey",v:1,models:["gemini-2.5-flash","gemini-2.5-flash-lite"]},
  mistral:{n:"Mistral",base:"https://api.mistral.ai/v1",keyUrl:"console.mistral.ai",models:["mistral-small-latest","open-mistral-nemo"]},
  github:{n:"GitHub Models",base:"https://models.github.ai/inference",keyUrl:"github.com/settings/tokens (токен GitHub)",models:["openai/gpt-4.1-mini","meta/Llama-3.3-70B-Instruct"]},
  pollinations:{n:"Pollinations (текст, картинки, видео, озвучка)",base:"https://gen.pollinations.ai/v1",chatUrl:"https://gen.pollinations.ai/v1/chat/completions",keyUrl:"enter.pollinations.ai (ключ необязателен, но с ним лимиты выше)",models:["openai","mistral","llama"]},
  custom:{n:"Свой провайдер (любой OpenAI-совместимый)",base:"",models:[]}
};
const PLABEL={"hf-inference":"Hugging Face · hf-inference (бесплатный)"};
for(const k in EXT)PLABEL[k]=EXT[k].n;
const PROVIDERS=["hf-inference",...Object.keys(EXT)];
const extKey=id=>LS.get("airtx_k_"+id)||"";
const baseOf=id=>id==="custom"?(LS.get("airtx_cbase")||""):EXT[id].base;
const chatUrl=m=>m.ext?(EXT[m.ext].chatUrl||baseOf(m.ext).replace(/\/+$/,"")+"/chat/completions"):"https://router.huggingface.co/v1/chat/completions";
const hdr=m=>{const k=m.ext?extKey(m.ext):token,h={"Content-Type":"application/json"};if(k)h.Authorization="Bearer "+k;return h};
function buildExt(){
  for(let i=MODELS.length-1;i>=0;i--)if(MODELS[i].ext)MODELS.splice(i,1);
  for(const id of Object.keys(EXT)){
    let ids=null;try{ids=JSON.parse(LS.get(id==="custom"?"airtx_cm":"airtx_em_"+id)||"null")}catch(e){}
    (ids&&ids.length?ids:EXT[id].models).forEach(x=>MODELS.push({id:x,name:x.split("/").pop().replace(/:free$/,""),type:"text",v:EXT[id].v?1:0,free:1,pv:id,ext:id}));
  }
  for(const [id,name,type] of [["flux","Flux (картинки)","image"],["seedance","Seedance (видео)","video"],["veo","Veo (видео)","video"],["alloy","Озвучка, голос alloy","tts"],["nova","Озвучка, голос nova","tts"]])
    MODELS.push({id,name,type,free:1,pv:"pollinations",ext:"pollinations"});
}
buildExt();
function renderExt(){
  const id=prov.value,E=EXT[id],b=$("extb");
  if(!E){b.innerHTML="";return}
  let h='<h3>'+esc(E.n)+'</h3>';
  if(id==="custom")h+='<input id="cu" placeholder="Адрес API, например https://api.example.com/v1" value="'+esc(LS.get("airtx_cbase")||"")+'" autocomplete="off">';
  h+='<input id="ek" type="password" placeholder="'+(id==="pollinations"?"ключ (необязательно)":"API-ключ")+'" autocomplete="off">'
    +'<button class="btn" id="eks" type="button">'+(extKey(id)?"Заменить ключ":"Сохранить ключ")+'</button>';
  if(E.keyUrl)h+='<small>Бесплатный ключ: '+esc(E.keyUrl)+'</small>';
  if(id==="custom")h+='<input id="cm" placeholder="ID модели, например llama-3.3-70b" autocomplete="off"><button class="btn" id="cma" type="button">Добавить модель</button>';
  else h+='<button class="btn" id="erf" type="button">Обновить список моделей</button>';
  h+='<div class="note" id="en" style="color:var(--mu)"></div><small>Ключ хранится только в этом браузере.</small>';
  b.innerHTML=h;
  const note=t=>{$("en").textContent=t};
  $("eks").onclick=()=>{
    if(id==="custom")LS.set("airtx_cbase",$("cu").value.trim());
    const k=$("ek").value.trim();if(k)LS.set("airtx_k_"+id,k);
    $("ek").value="";note(k?"Ключ сохранён ✓":(id==="custom"?"Адрес сохранён ✓":"Впиши ключ"));$("eks").textContent=extKey(id)?"Заменить ключ":"Сохранить ключ";
  };
  if($("cma"))$("cma").onclick=()=>{
    const m=$("cm").value.trim();if(!m){note("Впиши ID модели");return}
    if($("cu").value.trim())LS.set("airtx_cbase",$("cu").value.trim());
    let c=[];try{c=JSON.parse(LS.get("airtx_cm")||"[]")}catch(e){}
    if(!c.includes(m))c.push(m);LS.set("airtx_cm",JSON.stringify(c));
    reselect(()=>MODELS.findIndex(x=>x.ext==="custom"&&x.id===m));note("Модель добавлена ✓");
  };
  if($("erf"))$("erf").onclick=async()=>{
    const k=extKey(id);if(!k&&id!=="pollinations"){note("Сначала сохрани ключ");return}
    note("Загружаю список…");
    try{
      const r=await fetch(baseOf(id).replace(/\/+$/,"")+"/models",{headers:k?{Authorization:"Bearer "+k}:{}});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();let list=j.data||j.models||(Array.isArray(j)?j:[]);
      if(E.onlyFree)list=list.filter(x=>x.pricing&&+x.pricing.prompt===0&&+x.pricing.completion===0);
      let ids=list.map(x=>String(x.id||x.name||"").replace(/^models\//,"")).filter(x=>x&&!/embed|whisper|tts|guard|moderat|rerank|dall|imagen|veo|aqa/i.test(x)).slice(0,80);
      if(!ids.length)throw new Error("подходящих моделей не найдено");
      LS.set("airtx_em_"+id,JSON.stringify(ids));
      reselect(()=>MODELS.findIndex(x=>x.ext===id));note("Моделей: "+ids.length+" ✓");
    }catch(e){note("Не вышло: "+(e.message||e)+". Проверь ключ.")}
  };
}
// пересобрать список моделей и выбрать нужную (по функции, возвращающей индекс)
function reselect(find){buildExt();fillModels();const i=find();if(i>=0){setModel(i);LS.set("airtx_m",i)}}
function fillModels(){const pv=prov.value||"hf-inference";for(const s of [sel,sel2]){s.innerHTML="";MODELS.forEach((m,i)=>{if((m.pv||"hf-inference")===pv)s.add(new Option("🟢 "+ICON[m.type]+" "+m.name,i))})}}
PROVIDERS.forEach(p=>prov.add(new Option(PLABEL[p],p)));
{const sp=LS.get("airtx_p");if(sp&&PROVIDERS.includes(sp))prov.value=sp}
fillModels();
function setModel(i){sel.value=sel2.value=i;inp.placeholder={stt:"Прикрепи аудио 📎 и нажми ➤",tts:"Текст для озвучки…",image:"Опиши картинку…",video:"Опиши сцену…"}[MODELS[i].type]||(MODELS[i].v?"Напиши запрос (📎 — можно приложить фото)…":"Напиши запрос…")}
sel.onchange=()=>{setModel(sel.value);LS.set("airtx_m",sel.value)};sel2.onchange=()=>{setModel(sel2.value);LS.set("airtx_m",sel2.value)};
{const sv=parseInt(LS.get("airtx_m")),okm=MODELS[sv]&&(MODELS[sv].pv||"hf-inference")===prov.value,fi=MODELS.findIndex(m=>(m.pv||"hf-inference")===prov.value);if(okm||fi>=0)setModel(okm?sv:fi)}
prov.onchange=()=>{LS.set("airtx_p",prov.value);fillModels();const f=MODELS.findIndex(m=>(m.pv||"hf-inference")===prov.value);if(f>=0){setModel(f);LS.set("airtx_m",f)}renderExt()};
renderExt();
$("sys").value=LS.get("airtx_sys")||"";$("sys").oninput=()=>LS.set("airtx_sys",$("sys").value);
{const t=LS.get("airtx_t");if(t!=null)$("temp").value=t;$("tv").textContent=$("temp").value}
$("temp").oninput=()=>{$("tv").textContent=$("temp").value;LS.set("airtx_t",$("temp").value)};
const openSide=()=>side.classList.add("open"),closeSide=()=>side.classList.remove("open");
$("menu").onclick=openSide;$("bd").onclick=closeSide;
$("new").onclick=()=>{history=[];w.innerHTML="";w.append($("hello"));$("hello").style.display="";closeSide()};
inp.oninput=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px"};
inp.onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!busy&&matchMedia("(min-width:761px)").matches){e.preventDefault();$("f").requestSubmit()}
  else if(e.key==="ArrowUp"&&sent.length&&(!inp.value||inp.selectionStart===0)&&sentI>0){e.preventDefault();inp.value=sent[--sentI];inp.oninput()}
  else if(e.key==="ArrowDown"&&sentI<sent.length&&inp.selectionStart===inp.value.length){e.preventDefault();inp.value=++sentI<sent.length?sent[sentI]:"";inp.oninput()}
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSide()});
// вставка картинки из буфера и перетаскивание файлов
inp.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(x=>/^(image|audio)\//.test(x.type));if(f){e.preventDefault();setAtt(f)}});
let dragN=0;
addEventListener("dragenter",e=>{if(e.dataTransfer?.types?.includes("Files")){dragN++;document.body.classList.add("drag")}});
addEventListener("dragleave",()=>{if(--dragN<=0){dragN=0;document.body.classList.remove("drag")}});
addEventListener("dragover",e=>e.preventDefault());

function hasFree(mp){
  if(Array.isArray(mp))return mp.some(x=>x.provider==="hf-inference");

async function searchModels(){

async function saveToken(){
  const t=$("tk").value.trim();
  if(!/^hf_[A-Za-z0-9]{20,}$/.test(t)){accNote="Токен выглядит как hf_ и дальше только латинские буквы и цифры, без пробелов.";return renderAcc()}
  accNote="Проверяю токен…";renderAcc();
  try{
    const r=await fetch("https://huggingface.co/api/whoami-v2",{headers:{Authorization:"Bearer "+t}});
    if(r.status===401){accNote="Hugging Face не принял этот токен.";return renderAcc()}
    const j=r.ok?await r.json():{};
    hfUser={name:j.fullname||j.name||"Hugging Face",avatar:j.avatarUrl||""};
  }catch(e){hfUser={name:"Токен сохранён",avatar:""}}
  token=t;LS.set("airtx_hf",t);LS.set("airtx_hfu",JSON.stringify(hfUser));accNote="";renderAcc();
}
const HUB="https://esm.sh/@huggingface/hub";
async function hfLogin(){
  const clientId=CFG.HF_CLIENT_ID||window.huggingface?.variables?.OAUTH_CLIENT_ID;

  try{
    const hub=await import(HUB);
    location.href=await hub.oauthLoginUrl({clientId,scopes:"openid profile inference-api",redirectUrl:location.origin+location.pathname});
  }catch(e){accNote="Не удалось начать вход: "+(e.message||e);renderAcc()}

async function handleHfRedirect(){
  if(!/[?&]code=/.test(location.search))return;
  try{
    const hub=await import(HUB),r=await hub.oauthHandleRedirectIfPresent();
    if(r){token=r.accessToken;hfUser={name:r.userInfo.fullname||r.userInfo.name||r.userInfo.preferred_username,avatar:r.userInfo.avatarUrl||""};
      LS.set("airtx_hf",token);LS.set("airtx_hfu",JSON.stringify(hfUser));}
  }catch(e){accNote="Ошибка входа через Hugging Face: "+(e.message||e)}

function md(s){
  const parts=esc(s).split("```");
  return parts.map((p,i)=>i%2
    ?'<pre><code>'+p.replace(/^[\w+#.-]*\n/,"").replace(/\n$/,"")+'</code></pre>'
    :(i>0?p.replace(/^\n/,""):p).replace(i<parts.length-1?/\n$/:/$^/,"").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
  ).join("");
}
function fail(out,err,m){
  let msg=err.message||String(err),hint="";
  if(/401|403|unauthor|forbidden|permission|credentials/i.test(msg))hint="\n\nПроверь токен: у него должно быть право «Make calls to Inference Providers».";
  else if(/402|credit|quota|limit|payment/i.test(msg))hint="\n\nПохоже, закончился бесплатный лимит Inference Providers.";
  else if(/404|not found|not supported|no provider|unavailable|400/i.test(msg))hint="\n\nЭта модель сейчас недоступна у выбранного провайдера. Попробуй другого провайдера в списке или другую модель.";
  out.className="m b err";out.textContent="Ошибка ("+m.name+"): "+msg+hint;
}
async function readErr(r){

}

let WM=null;
const loadImg=s=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=s});
async function loadWM(){
  try{
    WM=await loadImg("watermark.png");
    const g=document.createElement("canvas").getContext("2d");g.drawImage(WM,0,0,1,1);g.getImageData(0,0,1,1);
  }catch(e){
    try{WM=await loadImg(WM_BUILTIN)}catch(x){WM=null}
  }
}
// плавающая траектория, пульсация размера и прозрачности
const wmPos=t=>({x:.5+.5*Math.sin(t*.7),y:.5+.5*Math.sin(t*.45+1.3),o:.6+.25*Math.sin(t*1.6),s:1+.1*Math.sin(t*2.2)});
function drawWM(g,W,H,t,fix){
  const p=fix?{x:.97,y:.97,o:.85,s:1}:wmPos(t);g.save();g.globalAlpha=p.o;
  if(WM){let h=H*.13*p.s,ww=h*WM.width/WM.height;if(ww>W*.6){ww=W*.6;h=ww*WM.height/WM.width}g.drawImage(WM,(W-ww)*p.x,(H-h)*p.y,ww,h)}
  else{const f=Math.min(H*.05,W*.12)*p.s;g.font="700 "+f+"px system-ui,sans-serif";const ww=g.measureText(CFG.WATERMARK).width;g.fillStyle="#fff";g.shadowColor="#000";g.shadowBlur=4;g.fillText(CFG.WATERMARK,(W-ww)*p.x,f+(H-f*1.4)*p.y)}
  g.restore();
}
function showVideo(out,blob){
  const url=URL.createObjectURL(blob);
  out.innerHTML='<div class="vid"><video controls loop playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture></video><canvas class="wm"></canvas></div>';
  const v=out.querySelector("video"),c=out.querySelector("canvas"),g=c.getContext("2d");
  v.src=url;v.autoplay=true;v.muted=true;noMenu(v);
  v.onloadedmetadata=()=>{c.width=v.videoWidth;c.height=v.videoHeight};
  (function tick(){if(!c.isConnected)return;g.clearRect(0,0,c.width,c.height);drawWM(g,c.width,c.height,v.currentTime);requestAnimationFrame(tick)})();
  addActions(out,[
    ["Скачать с ватермаркой",async b=>{b.disabled=true;b.textContent="Рендер… 0%";try{await stamp(url,n=>b.textContent="Рендер… "+n+"%")}catch(e){alert("Не вышло: "+e.message)}b.disabled=false;b.textContent="Скачать с ватермаркой"}],
    again(out)
  ]);
}
// Записывает видео заново с движущейся ватермаркой (лучше всего в Chrome)
function stamp(url,cb){
  return new Promise((ok,no)=>{
    const v=document.createElement("video");v.src=url;v.muted=true;v.playsInline=true;
    v.onloadedmetadata=()=>{
      const c=document.createElement("canvas"),W=c.width=v.videoWidth,H=c.height=v.videoHeight,x=c.getContext("2d");
      const mime=MediaRecorder.isTypeSupported("video/webm")?"video/webm":"video/mp4";
      const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:8e6}),parts=[];
      rec.ondataavailable=e=>parts.push(e.data);
      rec.onstop=()=>{save(URL.createObjectURL(new Blob(parts,{type:mime})),"airtx1-watermark",mime==="video/webm"?"webm":"mp4");ok()};
      const draw=()=>{x.drawImage(v,0,0,W,H);drawWM(x,W,H,v.currentTime);if(cb&&v.duration)cb(Math.min(99,Math.round(100*v.currentTime/v.duration)));if(!v.ended)requestAnimationFrame(draw)};
      v.onended=()=>setTimeout(()=>rec.stop(),150);
      rec.start();v.play().then(draw).catch(no);
    };
    v.onerror=()=>no(new Error("видео не открывается"));
  });
}
renderAcc();loadWM();
handleHfRedirect().then(renderAcc);
